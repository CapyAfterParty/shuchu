<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#d6dfe8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f151d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shuchu">
  <title>Shuchu</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/public/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/public/icon-180.png">
  <link rel="preload" href="/public/fonts/urbanist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/public/mist.css">
</head>
<body>
  <div class="mist" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="stones" aria-hidden="true"><b></b><b></b><b></b><b></b></div>

  <main class="capture">
    <form id="capture" class="glass capture-stone" autocomplete="off">
      <label for="text" class="whisper">catch a thought</label>
      <textarea id="text" rows="3" autofocus enterkeyhint="send" spellcheck="false"
                placeholder="call dentist thing…"></textarea>
      <button type="submit" class="glass save" data-depth="1.4" aria-label="Save"><span class="spark"></span></button>
    </form>
    <p id="status" class="whisper status" role="status" aria-live="polite"></p>
  </main>
  <p id="holding" class="whisper holding" aria-live="polite"></p>

  <script type="module" src="/js/clients/phone/look.js"></script>
  <script type="module" src="/js/clients/phone/phone.js"></script>
</body>
</html>
